name: 每日新闻更新

on:
  schedule:
    # 每天北京时间 8:00 自动执行（UTC 0:00）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install feedparser requests

      - name: 抓取新闻并生成 data.json
        run: python fetch_news.py

      - name: 提交更新（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "每日新闻更新 $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
          
